# UWSM makes Kitty read this user-owned config directory.
include ~/.config/kitty/kitty-themes/Tango_Dark.conf

font_family FantasqueSansM Nerd Font Mono
font_size 16.0
bold_font auto
italic_font auto
bold_italic_font auto

background_opacity 0.9
dynamic_background_opacity 1
confirm_os_window_close 0
cursor_trail 0
linux_display_server auto
allow_remote_control socket-only
remember_window_size no

scrollback_lines 2000
wheel_scroll_min_lines 1
enable_audio_bell no
window_padding_width 4
selection_foreground none
selection_background none

map --when-focus-on var:in_codex shift+enter send_text all \x0a
