# User hypridle overrides.
# This file is launched from UserConfigs/user_startup.lua so upgrade-owned
# ~/.config/hypr/hypridle.conf can change without bringing back idle popups.

general {
    lock_cmd = $HOME/.config/hypr/UserScripts/LockScreen.sh
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
    ignore_dbus_inhibit = false
}

# Screenlock after 15 minutes. No idle/return notifications.
listener {
    timeout = 900
    on-timeout = loginctl lock-session
}
