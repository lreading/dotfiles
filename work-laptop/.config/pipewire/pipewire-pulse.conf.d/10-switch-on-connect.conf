# Prefer newly connected physical audio devices. This makes the Framework
# Audio Expansion Card take over when its headphone jack activates and lets
# WirePlumber return to the previous available sink when it disconnects.
pulse.cmd = [
  {
    cmd = "load-module"
    # Keep PipeWire's normal HDMI exclusion and do not let the Astro's
    # voice-chat sink supersede its full-quality stereo-game sink.
    args = "module-switch-on-connect blocklist=hdmi|stereo-chat"
    flags = [ nofail ]
  }
]
