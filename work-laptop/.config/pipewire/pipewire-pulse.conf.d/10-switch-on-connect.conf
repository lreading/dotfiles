# Prefer newly connected physical audio devices. This makes the Framework
# Audio Expansion Card take over when its headphone jack activates and lets
# WirePlumber return to the previous available sink when it disconnects.
pulse.cmd = [
  {
    cmd = "load-module"
    # Keep HDMI and the Astro MixAmp outputs from becoming the default.
    # Meeting apps can still select the MixAmp directly.
    args = "module-switch-on-connect blocklist=hdmi|^alsa_output[.]usb-Astro_Gaming_Astro_MixAmp_Pro-"
    flags = [ nofail ]
  }
]
