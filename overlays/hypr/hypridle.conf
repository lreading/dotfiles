# User-owned Hypridle settings. Upstream patches preserve this live file.

general {
    lock_cmd = $HOME/.config/hypr/UserScripts/LockScreen.sh
    before_sleep_cmd = loginctl lock-session &   # lock the session without blocking suspend
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
    ignore_dbus_inhibit = false
}

# Screenlock after 15 minutes. No idle or return notifications.
listener {
    timeout = 900
    on-timeout = loginctl lock-session
}
